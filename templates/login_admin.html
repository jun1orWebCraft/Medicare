<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | MediCare Secure</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page admin-theme">
    <div class="auth-wrapper split-screen">
        <div class="brand-side">
            <div class="brand-overlay"></div>
            <div class="brand-content">
                <div class="brand-logo-container">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="MediCare Logo" class="admin-logo">
                </div>
                <h1>System <span class="highlight-alt">Command</span></h1>
                <p>Enterprise oversight, real-time hospital analytics, and secure user management.</p>
                
                <div class="admin-badge">
                    <span class="pulse-icon"></span> Secure Admin Environment
                </div>
            </div>
        </div>

        <div class="form-side">
            <div class="auth-card">
                <div class="form-header">
                    <h2>Admin Login</h2>
                    <p>Authorization required for system access</p>
                </div>

                {% if error %}
                <div class="alert-box">
                    <span class="alert-icon">⚠️</span> {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="modern-form">
                    <div class="input-wrapper">
                        <label>Administrator Email</label>
                        <input type="email" name="email" placeholder="name@medicare.system" required>
                    </div>
                    <div class="input-wrapper">
                        <label>Access Key</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-admin-submit">Initialize Session</button>
                </form>

                <div class="form-footer">
                    <a href="/login" class="back-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Switch Role
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
