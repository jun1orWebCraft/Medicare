<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - MediCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="auth-wrapper split-screen">
        <div class="brand-side patient-gradient">
            <div class="brand-content">
                <div class="main-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="MediCare Logo" class="floating-logo">
            </div>
                <h1>Patient<br><span>Portal</span></h1>
                <p>View records, book appointments, and manage your health.</p>
            </div>
        </div>
        <div class="form-side">
            <div class="auth-form-container">
                <div class="form-header">
                    <h2>Patient Access</h2>
                    <p>Welcome back!</p>
                </div>
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}
                <form method="POST" class="auth-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="patient@hospital.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-submit">Login as Patient</button>
                </form>
                <div class="form-footer">
                    <p>Don't have an account? <a href="/register/patient">Register here</a></p>
                    <a href="/login">← Back to role selection</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
