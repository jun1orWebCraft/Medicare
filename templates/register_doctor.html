<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Doctor - MediCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="register-page">
    <div class="auth-wrapper split-screen">
        <div class="brand-side admin-gradient">
            <div class="brand-content">
                <div class="brand-icon">👨‍⚕️</div>
                <h1>Add New<br><span>Doctor</span></h1>
                <p>Register a new doctor to the hospital staff.</p>
            </div>
        </div>
        <div class="form-side">
            <div class="auth-form-container">
                <div class="form-header">
                    <h2>Doctor Registration</h2>
                    <p>Add medical professional</p>
                </div>
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}
                <form method="POST" class="auth-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="name" placeholder="Dr. John Smith" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="doctor@hospital.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label>Specialization</label>
                        <input type="text" name="specialization" placeholder="Cardiology, Neurology, etc." required>
                    </div>
                    <div class="form-group">
                        <label>Qualification</label>
                        <input type="text" name="qualification" placeholder="MD, PhD, etc." required>
                    </div>
                    <div class="form-group">
                        <label>Years of Experience</label>
                        <input type="number" name="experience" placeholder="5" required>
                    </div>
                    <button type="submit" class="btn-submit">Register Doctor</button>
                </form>
                <div class="form-footer">
                    <a href="/admin/dashboard">← Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
